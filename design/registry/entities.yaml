# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
#             economy-designer, systems-designer (new cross-system entries,
#               after asking)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /design-review (Phase 1 — cross-doc facts, in place of sibling GDDs)
#             /content-audit (Step 2 — planned named-content count)
#             /balance-check (Phase 3 — intended constant/formula values)
#             /propagate-design-change (Step 3 — downstream GDD impact via referenced_by)
#             /asset-spec (named entities to write specs for)
#             economy-designer, systems-designer (before authoring items,
#               loot tables and formulas)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="design/gdd/inventory.md" -B 8
#                            (referenced_by is a block list, so match the
#                            path; referenced_by.*inventory never matches)
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised
#
# LAYOUT: the one shape .claude/scripts/registry.sh reads. Each section is a
#   key at column 0 holding a block list, or [] while it is empty. Each entry
#   starts "- name: <name>" with the dash at column 2 (or 0, the same for every
#   entry of a section); its fields sit two columns past the dash, and a deeper
#   line belongs to the field above it. Quote a value that holds ": ". A line
#   in any other shape is reported as unsupported layout, with its number.

version: 1
last_updated: "2026-11-12"

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: effect_damage_formula
    status: active
    source: design/gdd/effect-resolution-model.md
    referenced_by:
      - design/gdd/effect-resolution-model.md
      - design/gdd/combat-resolution.md
      - design/gdd/combat-state-and-step-model.md
    variables:
      - B
      - F
      - P
      - c
      - p
      - Raw
      - RawMax
      - Scaled
      - Cap
      - r
      - q
      - h
      - s
      - l
    output_range: [0, 2147483647]
    expression: "Raw = clamp(B + F, 0, RawMax); Scaled = (Raw * (1000 + P) + 500) / 1000; r = clamp(Scaled, 0, Cap); s = min(q, r); l = min(h, r - s)"
    notes: "Integer-only, round half up. P is the summed percent bucket clamped to at least -1000. Detonation uses B = min(c * p, RawMax). Shield absorbs first, then HP. No overflow path: Raw saturates at RawMax."
    added: 2026-11-11
    revised: 2026-11-11

  - name: synergy_modifier_totals
    status: active
    source: design/gdd/adjacency-and-synergy.md
    referenced_by:
      - design/gdd/adjacency-and-synergy.md
      - design/gdd/effect-resolution-model.md
      - design/gdd/item-trigger-and-cooldown.md
      - design/gdd/backpack-ui.md
      - design/gdd/hover-popup-and-glossary.md
    variables:
      - F_T
      - P_T
      - C_T
      - A_T
      - amount
    output_range: [-6000000, 6000000]
    expression: "F_T = sum of amount over active DamageFlat links into T; P_T = sum over DamagePercent links; C_T = sum over CooldownReduction links; A_T(s) = sum over StatusAmount links with status s"
    notes: "Integer sums, not clamped by System 10. System 3 reads F and P and clamps the summed P at -1000 at run time. At most 20 neighbours times 3 rules = 60 links per target, each at most 100000 in magnitude, so no overflow."
    added: 2026-11-12
    revised: ""

  - name: item_effective_cooldown
    status: active
    source: design/gdd/item-trigger-and-cooldown.md
    referenced_by:
      - design/gdd/item-trigger-and-cooldown.md
      - design/gdd/adjacency-and-synergy.md
      - design/gdd/backpack-ui.md
      - design/gdd/hover-popup-and-glossary.md
    variables:
      - N
      - C
      - N_eff
    output_range: [1, 99]
    expression: "N_eff = clamp(N - C, 1, 99); nextReadyAt = a + N_eff after a firing on owner action a; ready when a >= nextReadyAt"
    notes: "Cooldown is counted in the owner hero's own actions (a), including skipped ones. Applies to cooldown items and to reaction items. C is the CooldownReduction total from System 10 (negative lengthens). The floor 1 means an item fires at most once per action. The ceiling 99 is a representation guard, not a gameplay lever."
    added: 2026-11-12
    revised: 2026-11-12

  - name: effective_speed
    status: active
    source: design/gdd/turn-order.md
    referenced_by:
      - design/gdd/turn-order.md
      - design/gdd/combat-hud.md
    variables:
      - s
      - F
      - P
      - v
      - V_max
    output_range: [1, 200]
    expression: "v = clamp((max(0, s + F) * (1000 + P) + 500) / 1000, 1, V_max)"
    notes: "Integer, round half up; same additive percent bucket and rounding as effective_damage_formula. s is the base speed (5..60, provisional). F is the clamped sum (-50..50) of passive item speed bonuses of a hero (0 for an enemy); P is the clamped sum (-1000..1000) of future status modifiers and is 0 in the MVP. Gauge fills by v per time step; a unit acts when its gauge reaches gauge_threshold. Stored gauge never exceeds gauge_threshold + speed_effective_max - 1 (1199)."
    added: 2026-11-12
    revised: 2026-11-12

  - name: hero_max_hp
    status: active
    source: design/gdd/party-and-heroes.md
    referenced_by:
      - design/gdd/party-and-heroes.md
    variables:
      - h
      - B_perm
      - H
      - HP_cap
    output_range: [1, 10000]
    expression: "maxHP = clamp(h + B_perm + H, 1, HP_cap); H = clamp(sum of hpBonus of passive items in the frozen grid, -50, 200)"
    notes: "Integer. h is the hero's base max HP (40..300, provisional); B_perm is permanent growth from rewards (0..1000). Items in the stash or tray do not count. Every hero is restored to maxHP and its initial shield before each encounter."
    added: 2026-11-13
    revised: ""

  - name: enemy_scaled_hp
    status: active
    source: design/gdd/enemy-and-intent.md
    referenced_by:
      - design/gdd/enemy-and-intent.md
      - design/gdd/encounter-generation.md
    variables:
      - HP
      - m_hp
    output_range: [1, 1000000]
    expression: "ScaledHP = clamp((HP * m_hp + 500) / 1000, 1, 1000000); m_hp in 500..10000 permille (1000 = identity)"
    notes: "Integer, round half up. m_hp is set per encounter by System 16 and baked into the encounter instance before intents are bound. Speed, hit count and status amounts are never scaled."
    added: 2026-11-13
    revised: ""

  - name: enemy_scaled_damage
    status: active
    source: design/gdd/enemy-and-intent.md
    referenced_by:
      - design/gdd/enemy-and-intent.md
      - design/gdd/effect-resolution-model.md
    variables:
      - B
      - m_dmg
    output_range: [1, 100000]
    expression: "ScaledB = clamp((B * m_dmg + 500) / 1000, 1, 100000); m_dmg in 500..5000 permille (1000 = identity)"
    notes: "Integer, round half up; the floor of 1 keeps a hit from becoming a no-op. The intent tab shows the resolved damage of effect_damage_formula with ScaledB as base (damage before shield), as r or r x hits."
    added: 2026-11-13
    revised: ""

  - name: encounter_hp_multiplier
    status: active
    source: design/gdd/encounter-generation.md
    referenced_by:
      - design/gdd/encounter-generation.md
      - design/gdd/enemy-and-intent.md
    variables:
      - r
      - kick_hp
    output_range: [1000, 1620]
    expression: "m_hp = 1000 + 60 * (r - 1) + kick_hp(tier); r in 1..8; kick_hp White 0, Green 0, Blue 100, Purple 200 (provisional); the boss uses 1000"
    notes: "Permille, passed to System 14 as hpPermille (enemy_scaled_hp). Speed, hit count, status amounts and monster count are never scaled."
    added: 2026-11-13
    revised: ""

  - name: encounter_damage_multiplier
    status: active
    source: design/gdd/encounter-generation.md
    referenced_by:
      - design/gdd/encounter-generation.md
      - design/gdd/enemy-and-intent.md
    variables:
      - r
      - kick_dmg
    output_range: [1000, 1380]
    expression: "m_dmg = 1000 + 40 * (r - 1) + kick_dmg(tier); r in 1..8; kick_dmg White 0, Green 0, Blue 50, Purple 100 (provisional); the boss uses 1000"
    notes: "Permille, passed to System 14 as damagePermille (enemy_scaled_damage)."
    added: 2026-11-13
    revised: ""

  - name: encounter_danger_rating
    status: active
    source: design/gdd/encounter-generation.md
    referenced_by:
      - design/gdd/encounter-generation.md
    variables:
      - T
      - theta
    output_range: [1, 5]
    expression: "danger = 1 + count(k : T >= theta_k), theta = [20, 40, 70, 110] (provisional); T = sum over enemies of ceil(ScaledHP * N_D * v / (1000 * W_m)) with party size 3"
    notes: "Shown on the door card from total threat, never from the tier label. Computed at catalog build in 64-bit and stored with each (template, room)."
    added: 2026-11-13
    revised: ""

  - name: commitment_score
    status: active
    source: design/gdd/commitment-and-drop-model.md
    referenced_by:
      - design/gdd/commitment-and-drop-model.md
    variables:
      - n_g
      - k_g
    output_range: [0, 588000]
    expression: "S_g = 1000 * n_g + 500 * k_g; committed to the leader g1 iff n_g1 >= 3 and S_g1 - S_g2 >= 2000 (a tie is uncommitted)"
    notes: "n_g counts placed non-innate items carrying direction g in the hero grids; k_g counts distinct System 10 links touching g. Read from the frozen arrangement of the fight just won, before Thaw."
    added: 2026-11-13
    revised: ""

  - name: drop_bias_permille
    status: active
    source: design/gdd/commitment-and-drop-model.md
    referenced_by:
      - design/gdd/commitment-and-drop-model.md
    variables:
      - n_g1
      - room
    output_range: [0, 1500]
    expression: "B = min(BiasCap, Btable[min(n_g1, 6)]), Btable = [0, 0, 0, 250, 500, 750, 1000]; B = 0 before room 3 or when uncommitted; F = 1000 + B for items carrying the committed direction"
    notes: "Never changes the item-tier odds, which the door tier sets. System 17 reads the same function and adds no second multiplier."
    added: 2026-11-13
    revised: ""

  - name: drop_candidate_weight
    status: active
    source: design/gdd/commitment-and-drop-model.md
    referenced_by:
      - design/gdd/commitment-and-drop-model.md
    variables:
      - base
      - F
      - cf
    output_range: [500, 250000]
    expression: "w = base * F * cf / 1000; base 1..100, F 1000..2500, cf 1000 (first copy) or 500 (second copy); exact because F is a multiple of 250 and cf of 500"
    notes: "Used in the item stage of each slot after the item tier is drawn from the door-tier row."
    added: 2026-11-13
    revised: ""

  - name: door_tier_weights
    status: active
    source: design/gdd/door-generation-and-tiers.md
    referenced_by:
      - design/gdd/door-generation-and-tiers.md
    variables:
      - r
      - tier_1
      - tier_2
    output_range: [0, 1000]
    expression: "row[r] = permille weights [White, Green, Blue, Purple] summing to 1000 and zero below MinRoomForTier; card 3 uses row[r] with the weight of tier_1 zeroed if r >= MinDistinctRoom and tier_1 == tier_2, and Blue and Purple zeroed if r >= SafeCardRoom and both are Blue or Purple"
    notes: "Rows (provisional): r2 600/400/0/0; r3 500/350/150/0; r4 400/350/250/0; r5 300/300/250/150; r6 250/300/250/200; r7 200/300/300/200; r8 150/300/300/250. Zeros kept, never compacted; a single positive weight is a bound-1 call."
    added: 2026-11-13
    revised: ""

  - name: door_buff
    status: active
    source: design/gdd/door-generation-and-tiers.md
    referenced_by:
      - design/gdd/door-generation-and-tiers.md
    variables:
      - tier
    output_range: [0, 12]
    expression: "Buff(tier) = (hp, cells): White (4, 0), Green (8, 0), Blue (12, 0), Purple (12, 1); hpGranted = min(hp, DoorHpCap - doorHp_h), cellsGranted = min(cells, DoorCellCap - doorCells, lockedCells_h)"
    notes: "Certain, no roll; granted on winning the room behind the door to one hero chosen at claim time; raises B_perm (System 15) and opens a cell (System 8, Unlock)."
    added: 2026-11-13
    revised: ""

  - name: run_snapshot_checksum
    status: active
    source: design/gdd/run-state-and-flow.md
    referenced_by:
      - design/gdd/run-state-and-flow.md
    variables:
      - body
    output_range: [0, 18446744073709551615]
    expression: "FNV-1a 64 over every byte through the LF before the CHECKSUM line: h0 = 14695981039346656037; h = (h XOR b) * 1099511628211 mod 2^64 (unchecked); written as 16 lowercase hex digits"
    notes: "Never GetHashCode. The empty body hashes to cbf29ce484222325."
    added: 2026-11-13
    revised: ""

  - name: intents_calls_per_binding
    status: active
    source: design/gdd/run-state-and-flow.md
    referenced_by:
      - design/gdd/run-state-and-flow.md
      - design/gdd/enemy-and-intent.md
    variables:
      - E
    output_range: [24, 144]
    expression: "calls = 2 * intent_sequence_length * E with intent_sequence_length = 12 and E enemies (1 to 6); 9 bindings per full run (room 1, rooms 2 to 8, the boss)"
    notes: "At most 864 calls per run with 4 enemies per roster, 1296 at the cap of 6."
    added: 2026-11-13
    revised: ""

  - name: curse_stat_terms
    status: active
    source: design/gdd/curses-and-trade-offs.md
    referenced_by:
      - design/gdd/curses-and-trade-offs.md
      - design/gdd/party-and-heroes.md
    variables:
      - C_hp
      - C_speed
    output_range: [-50, 0]
    expression: "maxHP = clamp(h + B_perm + H + C_hp, 1, HP_cap) with C_hp = -p1 of Frailty or the HP rider of a Pinned curse, outside the clamp of H; F' = clamp(F, -50, 50) + C_speed with C_speed = -p1 of Sluggish or the speed rider of a Pinned curse, added after the clamp of F"
    notes: "Curse terms are read by HeroStats from the curse list in System 5's snapshot; nothing is written into B_perm or the baseline items."
    added: 2026-11-13
    revised: ""

  - name: input_pointer_to_native
    status: active
    source: design/gdd/input-and-focus.md
    referenced_by:
      - design/gdd/input-and-focus.md
    variables:
      - W
      - H
      - mouse
    output_range: [0, 639]
    expression: "scale = max(1, min(floor(W/640), floor(H/360))); offset = ((W - 640*scale)/2, (H - 360*scale)/2); native = floor((mouse - offset)/scale) with floor division toward negative infinity and y flipped to the top-left origin; hit iff 0 <= x < 640 and 0 <= y < 360"
    notes: "Truncating division reads a pointer 1 px left of the canvas as a hit; use floor division."
    added: 2026-11-13
    revised: ""

  - name: input_key_repeat_count
    status: active
    source: design/gdd/input-and-focus.md
    referenced_by:
      - design/gdd/input-and-focus.md
      - design/gdd/settings.md
    variables:
      - t
    output_range: [1, 1000]
    expression: "n(t) = 1 for t < 400, else 2 + floor((t - 400)/125) (boundary times inclusive; single-step gives 1)"
    notes: "Repeats are synthesised from Tick(t) by the device layer; the core reads no timer; only arrows and jump keys repeat."
    added: 2026-11-13
    revised: ""

